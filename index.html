    <!-- Anti-flicker theme script -->
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark-theme' || (!theme && prefersDark)) {
            document.documentElement.classList.add('dark-theme');
          } else {
            document.documentElement.classList.add('light-theme');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
    <header>
        <h1 id="home-btn" style="cursor: pointer;">LAB</h1>
        <p>Digital Workshop</p>
        <nav class="tool-nav">
            <!-- Factory: Work Tools -->
            <div class="pillar">
                <button class="pillar-btn" data-pillar="factory">Work 🔧</button>
                <div class="tool-list" data-pillar="factory">
                    <button class="tool-btn" data-tool="image-to-webp-converter">Image to WebP</button>
                    <button class="tool-btn" data-tool="math-calculator">Math Calculator</button>
                    <button class="tool-btn" data-tool="dj-audio-visualizer">DJ Audio Visualizer</button>
                    <button class="tool-btn" data-tool="subwoofer-enclosure-design">Subwoofer Design</button>
                </div>
            </div>
            <!-- Classroom: Learn Tools -->
            <div class="pillar">
                <button class="pillar-btn" data-pillar="classroom">Learn 📚</button>
                <div class="tool-list" data-pillar="classroom">
                    <button class="tool-btn" data-tool="life-path-calculator">Life Path</button>
                    <button class="tool-btn" data-tool="gematria-calculator">Gematria</button>
                    <button class="tool-btn" data-tool="moon-phase">Moon Phase</button>
                    <button class="tool-btn" data-tool="days-between-dates">Days Between Dates</button>
                    <button class="tool-btn" data-tool="year-progress-calculator">Year Progress</button>
                </div>
            </div>
            <!-- Retreat: Rest Tools -->
            <div class="pillar">
              <button class="pillar-btn" data-pillar="retreat">Rest 🌿</button>
              <div class="tool-list" data-pillar="retreat">
                <button class="tool-btn" data-tool="binaural-beats">Binaural Beats</button>
              </div>
            </div>
            <!-- Arcade: Play Tools -->
            <div class="pillar">
                <button class="pillar-btn" data-pillar="arcade">Play 🎮</button>
                <div class="tool-list" data-pillar="arcade">
                    <button class="tool-btn" data-tool="radiostream-player" data-tool-iframe="https://jasonbra1n.github.io/Radio-Stream-Player/">Radio Stream Player</button>
                    <button class="tool-btn" data-tool="magic-8-ball">Magic 8 Ball</button>
                    <button class="tool-btn" data-tool="memory-game">Memory Game</button>
                    <button class="tool-btn" data-tool="denon-cd-player" data-tool-iframe="https://jasonbra1n.github.io/Denon-DN-1000F-Web-Emulator/">Denon CD Player</button>
                </div>
            </div>
            <!-- Info Pillar -->
            <div class="pillar">
                <button class="pillar-btn" data-pillar="info">Info 🧠</button>
                <div class="tool-list" data-pillar="info">
                    <button class="tool-btn" data-tool="about-page">About This Project</button>
                </div>
            </div>
        </nav>
    </header>
    
    <main id="console-container">
        <div id="tool-container">
            <div class="welcome-message">
                <h2>Welcome to Jason Brain's Lab</h2>
                <p>Select a tool from the navigation above to begin.</p>
            </div>
        </div>
    </main>
    
    <footer>
        <p>Open source project by <a href="https://jasonbrain.com" target="_top">Jason Brain</a> |
           <a href="https://github.com/jasonbra1n/" target="_blank">GitHub</a> © <span id="copyright-year">2025</span></p>
    </footer>
    
    <script src="script.js"></script>
</body>
