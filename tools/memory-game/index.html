<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Master Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">
            <span class="sparkle">✨</span>
            Memory Master
            <span class="sparkle">✨</span>
        </h1>
        <p class="game-subtitle">Match all the pairs to win!</p>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="moves">0</div>
                <div class="stat-label">Moves</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="matches">0/8</div>
                <div class="stat-label">Matches</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="time">0:00</div>
                <div class="stat-label">Time</div>
            </div>
        </div>

        <div class="game-board" id="gameBoard"></div>

        <button class="restart-btn" onclick="initializeGame()">
            🔄 New Game
        </button>

        <div class="win-modal" id="winModal">
            <div class="win-content">
                <div class="trophy">🏆</div>
                <h2>Congratulations!</h2>
                <p id="winMessage"></p>
                <button class="play-again-btn" onclick="initializeGame()">
                    Play Again
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
