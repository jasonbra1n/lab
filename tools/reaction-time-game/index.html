<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reaction Mini-Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Reaction Mini-Game</h1>
  <button id="start">Start</button>

  <div id="gameArea">
    <canvas id="fx" width="300" height="400"></canvas>
  </div>

  <div id="modal" hidden>
    <h2>Best Reaction: <span id="best">0</span> ms</h2>
    <button id="again">Play Again</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
