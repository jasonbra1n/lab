<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reaction-Time Game</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <h1>Click the Green Dot!</h1>

  <div id="scoreboard">
    <span id="score">0</span> / 5 dots  |  Best: <span id="best">—</span> ms
  </div>

  <div id="game">
    <button id="start">Start</button>
    <button id="dot" hidden></button>
    <canvas id="fx"></canvas>
  </div>

  <div id="modal" hidden>
    <div id="box">
      <h2 id="result"></h2>
      <button id="restart">Play Again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
