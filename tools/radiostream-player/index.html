
<div class="container">
    <h2>Radio Stream Player</h2>
   
    <div class="radiostream-player">
    <h2>Radio Stream Player</h2>

    <div class="vu-meters">
        <div class="vu-meter">
            <div class="vu-level" id="left-vu-level"></div>
        </div>
        <div class="vu-meter">
            <div class="vu-level" id="right-vu-level"></div>
        </div>
        <button class="console-btn" id="vu-style-btn">Cycle VU Style</button>
    </div>

    <div class="player-content">
        <div class="station-selector">
            <label for="station-select">Select Station:</label>
            <select id="station-select">
                <option value="https://stream.eternity.fm/trance">ETN-FM Trance</option>
                <option value="https://stream.psyndora.com/stream">Psyndora Psytrance</option>
                <option value="https://dmt-fm.stream.laut.fm/dmt-fm">DMT-FM</option>
                <option value="https://bomradio.net/stream">BOM Psytrance Radio</option>
                <option value="https://stream.psychedelic.fm/psy">Psychedelic FM</option>
                <option value="https://melodichouse.stream.laut.fm/melodichouse">Melodic House Radio</option>
            </select>
        </div>

        <div class="player-controls">
            <button class="console-btn" id="play-pause-btn">Play</button>
            <button class="console-btn" id="popout-btn">Pop-out Player</button>
            <div class="volume-control">
                <label for="volume-slider">Volume:</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>

        <div class="now-playing" id="now-playing">Now Playing: ETN-FM Trance</div>
    </div>
</div>

<script>
    if (typeof initRadioStreamPlayer === 'function') {
        initRadioStreamPlayer();
    }
</script>
