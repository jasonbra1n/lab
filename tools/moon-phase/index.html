<script>
    console.log('Inline script executing at top of page');
    // Test if DOM is accessible
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM loaded - Inline script running');
        const phaseName = document.getElementById('phase-name');
        if (phaseName) phaseName.textContent = 'Inline Test Phase (Top)';
        const currentDate = document.getElementById('current-date');
        if (currentDate) currentDate.textContent = new Date().toISOString().split('T')[0];
        const loadingStatus = document.getElementById('loading-status');
        if (loadingStatus) loadingStatus.textContent = 'Loaded (Inline Test Top)';
    });
</script>
<div class="container">
    <h2>Moon Phase</h2>
    <div class="moon-phase">
        <div class="moon-visual" id="moon-visual"></div>
        <div class="moon-info">
            <div class="phase-name" id="phase-name">Loading...</div>
            <div class="phase-date">Date: <span id="current-date">Loading...</span></div>
        </div>
        <div class="date-picker">
            <label for="date-input">Select Date: </label>
            <input type="date" id="date-input">
        </div>
        <button class="console-btn" id="refresh-btn">Refresh</button>
        <div class="next-phases" id="next-phases">
            <h3>Upcoming Moon Phases</h3>
            <div class="phase-list" id="phase-list">Loading upcoming phases...</div>
        </div>
    </div>
    <div id="loading-status" style="text-align: center; color: var(--text-color); margin-top: 10px;">Loading...</div>
</div>
<script src="astronomy.browser.js"></script>
<script src="script.js"></script>
