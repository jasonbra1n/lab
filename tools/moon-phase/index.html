<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Phase Tool</title>
    <link rel="stylesheet" href="/styles.css"> <!-- Adjust path to your global styles if needed -->
    <style>
        .moon-phase-container {
            text-align: center;
            padding: 20px;
        }
        .moon-icon {
            font-size: 40px;
        }
        .moon-new { content: "🌑"; }
        .moon-waxing-crescent { content: "🌒"; }
        .moon-first-quarter { content: "🌓"; }
        .moon-waxing-gibbous { content: "🌔"; }
        .moon-full { content: "🌕"; }
        .moon-waning-gibbous { content: "🌖"; }
        .moon-last-quarter { content: "🌗"; }
        .moon-waning-crescent { content: "🌘"; }
    </style>
</head>
<body>
    <div class="moon-phase-container">
        <h2>Moon Phase</h2>
        <div id="moon-icon" class="moon-icon"></div>
        <p>Phase: <span id="moon-phase">Loading...</span></p>
        <p>Days in Cycle: <span id="days-in-cycle">0.00</span></p>
        <h3>Next Phases</h3>
        <p>Full Moon: <span id="next-full-moon">Loading...</span></p>
        <p>Last Quarter: <span id="next-last-quarter">Loading...</span></p>
        <p>New Moon: <span id="next-new-moon">Loading...</span></p>
        <p id="loading-status">Loading...</p>
    </div>

    <!-- Include the local Astronomy Engine library -->
    <script src="astronomy.browser.js"></script>
    <script src="script.js"></script>
</body>
</html>
